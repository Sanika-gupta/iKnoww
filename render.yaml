# Deploy configuration for Render.
#
# No persistent disk. Render's free instances do not support one, and in
# SIMULATED mode the app does not need one: it seeds itself on an empty boot, so
# an ephemeral filesystem gets a clean, correct, fully working app on every cold
# start rather than a broken one (D-061). Every byte of simulated data is
# generated, which is what makes reseeding correct rather than lossy.
#
# The LIVE feed is the exception, and it is a real limitation rather than a
# design choice: a watchlist built there cannot be regenerated by a seed, so it
# is lost when the instance sleeps. The three reference indices come back on the
# next boot; the cards do not. Said plainly in the README and on the live panel
# rather than left to be discovered (D-116).
#
# To keep state across restarts on a paid instance, add:
#   disk: { name: data, mountPath: /var/data, sizeGB: 1 }
#   and set DB_DIR to /var/data -- the directory, not a file, because there are
#   two databases now: iknoww.db and iknoww-live.db.
#
# Region is Singapore because it cannot be changed after the service exists, and
# because the tick loop is stepped from the browser (D-085): a twelve-tick crash
# scenario is twelve round trips, so the default US region would add roughly two
# and a half seconds to the single moment the demo turns on. Judges are in India.
services:
  - type: web
    name: iknoww
    region: singapore
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
